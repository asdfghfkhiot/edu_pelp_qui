<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Zadanie 2 — zbiór na płaszczyźnie zespolonej</title>
  <desc id="desc">Półdysk o środku minus jeden plus i, promieniu pierwiastek z dwóch; dolny promień i środek są wyłączone, górny promień jest włączony.</desc>
  <defs>
    <pattern id="grid" width="85" height="85" patternUnits="userSpaceOnUse" x="5" y="65">
      <path d="M 85 0 L 0 0 0 85" fill="none" stroke="#e7edf3" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#344256"/>
    </marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1769aa"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="54" y="48" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172638">Zadanie 2 · zbiór na płaszczyźnie zespolonej</text>
  <text x="54" y="78" font-family="Arial, sans-serif" font-size="16" fill="#526174">Przesunięcie: w = z + 1 − i, więc środek koła to C = (−1, 1).</text>

  <!-- Cartesian grid and axes -->
  <rect x="25" y="105" width="720" height="595" fill="url(#grid)"/>
  <line x1="38" y1="575" x2="745" y2="575" stroke="#344256" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="695" x2="430" y2="105" stroke="#344256" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="562" font-family="Arial, sans-serif" font-size="17" font-style="italic" fill="#263548">Re z</text>
  <text x="442" y="122" font-family="Arial, sans-serif" font-size="17" font-style="italic" fill="#263548">Im z</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#536273" text-anchor="middle">
    <path d="M260 570v10 M90 570v10 M600 570v10" stroke="#344256" stroke-width="1.5"/>
    <text x="260" y="599">−1</text><text x="90" y="599">−2</text><text x="600" y="599">1</text>
    <path d="M425 405h10 M425 235h10 M425 65h10" stroke="#344256" stroke-width="1.5"/>
    <text x="411" y="410">1</text><text x="411" y="240">2</text><text x="411" y="70">3</text>
  </g>

  <!-- Filled half-disk: center C, radius sqrt(2); sector angles (-pi/4, 3pi/4] -->
  <path d="M260 405 L430 575 A240.416 240.416 0 0 0 90 235 L260 405 Z" fill="#68b7e8" fill-opacity="0.28"/>
  <!-- Circular boundary, with the excluded lower endpoint indicated separately -->
  <path d="M430 575 A240.416 240.416 0 0 0 90 235" fill="none" stroke="#1769aa" stroke-width="3.5"/>
  <!-- Excluded boundary ray; included opposite ray -->
  <line x1="260" y1="405" x2="430" y2="575" stroke="#bb4b45" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="260" y1="405" x2="90" y2="235" stroke="#1769aa" stroke-width="3.5"/>
  <path d="M230 375 A42 42 0 0 0 290 375" fill="none" stroke="#1769aa" stroke-width="2.3" marker-end="url(#blueArrow)"/>

  <!-- Boundary markers: hollow = excluded, filled = included -->
  <circle cx="260" cy="405" r="7" fill="#fff" stroke="#bb4b45" stroke-width="3"/>
  <circle cx="430" cy="575" r="7" fill="#fff" stroke="#bb4b45" stroke-width="3"/>
  <circle cx="90" cy="235" r="6.5" fill="#1769aa" stroke="#fff" stroke-width="1.5"/>

  <!-- Labels -->
  <g font-family="Arial, sans-serif" fill="#172638">
    <text x="446" y="605" font-size="15" font-weight="700">z = 0</text>
    <text x="48" y="218" font-size="15" font-weight="700">(−2, 2)</text>
    <text x="276" y="427" font-size="15" font-weight="700">C = (−1, 1) = −1 + i</text>
    <text x="333" y="327" font-size="14" fill="#1769aa">łuk: |z + 1 − i| = √2</text>
    <text x="344" y="489" font-size="14" fill="#a43d38">kąt −π/4 — wyłączony</text>
    <text x="103" y="290" font-size="14" fill="#1769aa">kąt 3π/4 — włączony</text>
  </g>

  <!-- Explanation panel -->
  <rect x="765" y="135" width="208" height="440" rx="14" fill="#f5f8fb" stroke="#d7e0e9"/>
  <text x="789" y="174" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172638">Oznaczenia</text>
  <rect x="789" y="196" width="26" height="18" rx="3" fill="#68b7e8" fill-opacity="0.38" stroke="#1769aa"/>
  <text x="825" y="210" font-family="Arial, sans-serif" font-size="14" fill="#263548">należy do zbioru</text>
  <line x1="789" y1="244" x2="818" y2="244" stroke="#1769aa" stroke-width="3"/>
  <circle cx="803" cy="244" r="5" fill="#1769aa"/>
  <text x="825" y="249" font-family="Arial, sans-serif" font-size="14" fill="#263548">brzeg włączony</text>
  <line x1="789" y1="283" x2="818" y2="283" stroke="#bb4b45" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="803" cy="283" r="5" fill="#fff" stroke="#bb4b45" stroke-width="2"/>
  <text x="825" y="288" font-family="Arial, sans-serif" font-size="14" fill="#263548">brzeg wyłączony</text>
  <line x1="789" y1="310" x2="949" y2="310" stroke="#d7e0e9"/>
  <text x="789" y="344" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172638">Opis zbioru</text>
  <text x="789" y="374" font-family="Arial, sans-serif" font-size="14" fill="#344256">
    <tspan x="789" dy="0">Półdysk o środku</tspan>
    <tspan x="789" dy="22">(−1, 1) i promieniu √2.</tspan>
    <tspan x="789" dy="35">Zawiera półokrąg</tspan>
    <tspan x="789" dy="22">oraz promień pod</tspan>
    <tspan x="789" dy="22">kątem 3π/4.</tspan>
    <tspan x="789" dy="35">Nie zawiera promienia</tspan>
    <tspan x="789" dy="22">pod kątem −π/4 ani</tspan>
    <tspan x="789" dy="22">środka (arg 0 nie istnieje).</tspan>
  </text>
  <text x="54" y="735" font-family="Arial, sans-serif" font-size="13" fill="#667587">Współrzędne na rysunku: z = x + iy ↔ (x, y).</text>
</svg>
